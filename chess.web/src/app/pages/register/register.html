<div class="flex min-h-screen items-center justify-center bg-slate-100 px-4">
  <mat-card class="w-full max-w-sm p-4">
    <mat-card-header>
      <mat-card-title class="w-full text-center text-2xl">Create an account</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-2 pt-4">
        <mat-form-field appearance="outline">
          <mat-label>Username</mat-label>
          <input matInput id="username" type="text" formControlName="username" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput id="password" type="password" formControlName="password" autocomplete="new-password" />
          @if (form.controls.password.touched && form.controls.password.hasError('minlength')) {
            <mat-error>Password must be at least 6 characters.</mat-error>
          }
        </mat-form-field>

        @if (errorMessage()) {
          <p class="mb-2 text-sm text-red-600">{{ errorMessage() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || isSubmitting()" class="!py-1">
          {{ isSubmitting() ? 'Creating account…' : 'Register' }}
        </button>
      </form>

      <p class="mt-4 text-center text-sm text-slate-500">
        Already have an account?
        <a mat-button color="primary" routerLink="/login">Log in</a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
