<div class="min-h-screen bg-slate-100 px-4 py-8">
  <div class="mx-auto max-w-md">
    <a mat-button routerLink="/" class="mb-6">&larr; Back</a>

    <mat-card class="p-4">
      <mat-card-header>
        <mat-card-title class="w-full text-center text-2xl">Play chess</mat-card-title>
      </mat-card-header>

      <mat-card-content class="pt-4">
        <section class="mb-8">
          <h2 class="mb-3 text-sm font-medium text-slate-600">Start a new game</h2>

          <mat-button-toggle-group
            class="mb-4 w-full"
            [value]="selectedTimeControlIndex()"
            (change)="selectedTimeControlIndex.set($event.value)"
          >
            @for (option of timeControlOptions; track option.label; let i = $index) {
              <mat-button-toggle [value]="i" class="flex-1">{{ option.label }}</mat-button-toggle>
            }
          </mat-button-toggle-group>

          <div class="grid grid-cols-3 gap-2">
            <button mat-stroked-button (click)="createGame('white')" [disabled]="isCreating()">White</button>
            <button mat-stroked-button (click)="createGame()" [disabled]="isCreating()">Random</button>
            <button mat-stroked-button (click)="createGame('black')" [disabled]="isCreating()">Black</button>
          </div>
        </section>

        <section>
          <h2 class="mb-3 text-sm font-medium text-slate-600">Join a game</h2>
          <form (ngSubmit)="joinGame()" class="flex items-start gap-2">
            <mat-form-field appearance="outline" class="w-full">
              <mat-label>Game ID</mat-label>
              <input matInput [ngModel]="joinGameId()" (ngModelChange)="joinGameId.set($event)" name="gameId" />
            </mat-form-field>
            <button mat-flat-button color="primary" type="submit" class="!mt-1">Join</button>
          </form>
        </section>

        @if (errorMessage()) {
          <p class="mt-4 text-sm text-red-600">{{ errorMessage() }}</p>
        }
      </mat-card-content>
    </mat-card>
  </div>
</div>
