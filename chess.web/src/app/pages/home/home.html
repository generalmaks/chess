<div class="min-h-screen bg-slate-100 px-4 py-8">
  <div class="mx-auto max-w-3xl">
    <header class="mb-8 flex items-center justify-between">
      <div>
        <h1 class="text-2xl font-semibold text-slate-800">Chess</h1>
        <p class="text-sm text-slate-500">
          Welcome, {{ auth.username() }} · Elo {{ auth.eloRating() }}
        </p>
      </div>
      <button
        type="button"
        (click)="logout()"
        class="rounded-md border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-200"
      >
        Log out
      </button>
    </header>

    <p class="text-slate-600">You're logged in.</p>
  </div>
</div>
